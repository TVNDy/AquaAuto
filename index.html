
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#065f46">
  <title>AquaAuto - Bảng Điều Khiển</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Custom Switch Toggle */
    .toggle-checkbox:checked { right: 0; border-color: #10b981; }
    .toggle-checkbox:checked + .toggle-label { background-color: #10b981; }
    .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
    .toggle-label { background-color: #cbd5e1; transition: all 0.3s; }
    .loading-spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col overflow-hidden select-none">

  <!-- Header -->
  <header class="bg-emerald-800 text-white px-5 py-4 flex justify-between items-center shadow-md z-10 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center font-black text-xl shadow-inner">A</div>
      <div>
        <h1 class="font-bold text-xl leading-tight tracking-tight">AquaAuto</h1>
        <p class="text-xs text-emerald-200 mt-0.5">Trạm: <span id="gateway-label" class="font-mono">...</span></p>
      </div>
    </div>
    <div id="conn-badge" class="flex items-center gap-1.5 bg-emerald-900/60 px-3 py-1.5 rounded-full text-xs font-medium border border-emerald-600/50 transition-colors">
      <div id="conn-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div>
      <span id="conn-text">Kết nối...</span>
    </div>
  </header>

  <!-- Alert Banner -->
  <div id="power-alert" class="hidden bg-red-600 text-white px-5 py-3 shadow-lg z-20 flex justify-between items-center animate-bounce">
    <div class="flex items-center gap-3">
      <svg class="w-6 h-6 text-red-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      <div>
        <p class="font-bold text-sm uppercase tracking-wide">Mất nguồn 220V!</p>
        <p class="text-xs text-red-200">Kiểm tra ngay điện lưới bờ ao.</p>
      </div>
    </div>
    <button onclick="document.getElementById('power-alert').classList.add('hidden')" class="text-xs bg-white text-red-700 font-bold px-3 py-1.5 rounded-lg shadow-sm">Đóng</button>
  </div>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto bg-gray-50 pb-24">
    
    <!-- DASHBOARD TAB -->
    <div id="tab-dashboard" class="p-4 space-y-4">
      
      <!-- Ao 1 Card -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-5 border-b border-gray-50 flex justify-between items-start">
          <div class="flex gap-4">
            <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 shrink-0">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <input type="text" id="node-name" value="Bơm oxy ao 1" class="font-bold text-gray-800 text-lg bg-transparent border-b border-transparent hover:border-gray-300 focus:border-emerald-500 focus:outline-none transition-colors w-40" onchange="saveNodeName(this.value)">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
              </div>
              <div class="flex items-center gap-3 mt-1.5 text-xs font-medium">
                <span class="flex items-center gap-1 text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Online
                </span>
                <span class="text-gray-500 flex items-center gap-1" id="wifi-rssi">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg>
                  -- dBm
                </span>
              </div>
            </div>
          </div>
        </div>
        
        <div class="p-5 bg-gray-50/50 flex justify-between items-center">
          <div>
            <p class="text-sm font-semibold text-gray-700">Trạng thái động cơ</p>
            <p class="text-xs text-gray-500 mt-0.5" id="state-text">Đang tắt</p>
          </div>
          
          <!-- UI Toggle Switch -->
          <div class="relative inline-block w-14 h-8 align-middle select-none">
            <input type="checkbox" id="relay-toggle" class="toggle-checkbox absolute block w-8 h-8 rounded-full bg-white border-4 appearance-none cursor-pointer" onclick="toggleRelay(event)">
            <label for="relay-toggle" class="toggle-label block overflow-hidden h-8 rounded-full bg-gray-300 cursor-pointer"></label>
            
            <!-- Loading overlay -->
            <div id="relay-loading" class="hidden absolute inset-0 rounded-full bg-white/50 flex items-center justify-center">
              <svg class="w-5 h-5 text-emerald-600 loading-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </div>
          </div>
        </div>
      </div>
      
    </div>

    <!-- SCHEDULE TAB -->
    <div id="tab-schedule" class="hidden p-5 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-lg text-gray-800">Lịch trình chạy tự động</h2>
        <button class="text-sm text-emerald-600 font-bold bg-emerald-50 px-3 py-1.5 rounded-lg">+ Thêm lịch</button>
      </div>
      
      <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 text-center">
        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3">
          <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <p class="text-gray-500 text-sm">Chưa có lịch trình nào được tạo.</p>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="hidden p-5 space-y-4">
      <h2 class="font-bold text-lg text-gray-800">Cài đặt hệ thống</h2>
      
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-4 border-b border-gray-100 flex justify-between items-center">
          <span class="text-sm font-medium text-gray-600">Mã Gateway (ID)</span>
          <span class="text-sm font-bold text-gray-900 font-mono" id="info-id">--</span>
        </div>
        <div class="p-4 flex justify-between items-center">
          <span class="text-sm font-medium text-gray-600">Khóa bảo mật (Key)</span>
          <span class="text-sm font-bold text-gray-900 font-mono" id="info-key">***</span>
        </div>
      </div>
      
      <button class="w-full bg-white border border-gray-200 text-gray-700 font-bold py-3.5 rounded-xl shadow-sm text-sm flex justify-center items-center gap-2 hover:bg-gray-50 transition">
        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Ghép thêm thiết bị mới
      </button>
    </div>
    
  </main>

  <!-- Bottom Navigation -->
  <nav class="bg-white border-t border-gray-200 flex justify-around pb-safe shadow-[0_-10px_20px_rgba(0,0,0,0.03)] fixed bottom-0 w-full z-30">
    <button onclick="switchTab('dashboard')" class="flex-1 py-3 flex flex-col items-center text-emerald-600 font-medium tab-btn transition-colors" id="btn-dashboard">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      <span class="text-[10px]">Thiết bị</span>
    </button>
    <button onclick="switchTab('schedule')" class="flex-1 py-3 flex flex-col items-center text-gray-400 tab-btn hover:text-gray-600 transition-colors" id="btn-schedule">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span class="text-[10px]">Lịch trình</span>
    </button>
    <button onclick="switchTab('settings')" class="flex-1 py-3 flex flex-col items-center text-gray-400 tab-btn hover:text-gray-600 transition-colors" id="btn-settings">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      <span class="text-[10px]">Cài đặt</span>
    </button>
  </nav>

  <script>
    // 1. Khôi phục tên trạm
    const savedName = localStorage.getItem('dyauto_node_name');
    if(savedName) document.getElementById('node-name').value = savedName;
    
    function saveNodeName(val) {
      localStorage.setItem('dyauto_node_name', val);
    }

    // 2. Trích xuất ID và Key
    const params = new URLSearchParams(window.location.search);
    let gatewayId = params.get('id') || localStorage.getItem('dyauto_id');
    let secretKey = params.get('key') || localStorage.getItem('dyauto_key');

    if (gatewayId && secretKey) {
      localStorage.setItem('dyauto_id', gatewayId);
      localStorage.setItem('dyauto_key', secretKey);
      document.getElementById('gateway-label').innerText = gatewayId;
      document.getElementById('info-id').innerText = gatewayId;
    } else {
      alert("⚠️ Không tìm thấy mã trạm! Vui lòng quét mã QR trên hộp thiết bị để sử dụng.");
    }

    // 3. Cấu hình MQTT
    const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
    const topicCmd = `dyauto/${gatewayId}_${secretKey}/command`;
    const topicStatus = `dyauto/${gatewayId}_${secretKey}/status`;
    let client = null;
    let isRelayOn = false;
    let isDebouncing = false;

    if (gatewayId && secretKey) {
      client = mqtt.connect(brokerUrl, {
        clientId: 'App_' + Math.random().toString(16).slice(2, 8),
        clean: true, reconnectPeriod: 3000
      });

      client.on('connect', () => {
        const badge = document.getElementById('conn-badge');
        badge.className = 'flex items-center gap-1.5 bg-emerald-100 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-700 border border-emerald-200 transition-colors';
        document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]';
        document.getElementById('conn-text').innerText = 'Trực tuyến';
        client.subscribe(topicStatus);
      });

      client.on('offline', () => {
        const badge = document.getElementById('conn-badge');
        badge.className = 'flex items-center gap-1.5 bg-red-100 px-3 py-1.5 rounded-full text-xs font-bold text-red-700 border border-red-200 transition-colors';
        document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-red-500';
        document.getElementById('conn-text').innerText = 'Mất mạng';
      });

      client.on('message', (topic, message) => {
        if (topic === topicStatus) {
          try {
            const data = JSON.parse(message.toString());
            if (data.node === 1) {
              isRelayOn = (data.state === 'ON');
              
              // Cập nhật UI Switch
              const toggle = document.getElementById('relay-toggle');
              if(!isDebouncing) {
                toggle.checked = isRelayOn;
              }
              document.getElementById('state-text').innerText = isRelayOn ? 'Đang chạy' : 'Đang tắt';
              document.getElementById('state-text').className = isRelayOn ? 'text-xs mt-0.5 font-bold text-emerald-600' : 'text-xs text-gray-500 mt-0.5 font-medium';

              if (data.wifi !== undefined) {
                document.getElementById('wifi-rssi').innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg> ${data.wifi} dBm`;
              }
              
              // Cảnh báo mất nguồn 220V
              if(data.power === "LOST") {
                  document.getElementById('power-alert').classList.remove('hidden');
              } else {
                  document.getElementById('power-alert').classList.add('hidden');
              }
            }
          } catch(e) {}
        }
      });
    }

    // 4. Xử lý nút bấm (State of Truth + Debounce)
    function toggleRelay(e) {
      if (!client || !client.connected) {
          e.preventDefault();
          alert("Chưa kết nối đến máy chủ. Vui lòng kiểm tra mạng.");
          return;
      }
      
      if (isDebouncing) {
          e.preventDefault();
          return; // Khóa nếu đang chờ
      }
      
      isDebouncing = true;
      const loader = document.getElementById('relay-loading');
      loader.classList.remove('hidden');
      
      // Chặn UI tự nhảy
      e.preventDefault(); 
      
      const newCmd = isRelayOn ? 'OFF' : 'ON';
      client.publish(topicCmd, JSON.stringify({ node: 1, cmd: newCmd }), { qos: 1 });
      
      // Mở khóa sau 2 giây
      setTimeout(() => {
        isDebouncing = false;
        loader.classList.add('hidden');
        // Nếu sau 2s không nhận được phản hồi, tự reset UI về thực tế
        document.getElementById('relay-toggle').checked = isRelayOn;
      }, 2000);
    }

    // 5. Đổi Tab
    function switchTab(tabId) {
      document.getElementById('tab-dashboard').classList.add('hidden');
      document.getElementById('tab-schedule').classList.add('hidden');
      document.getElementById('tab-settings').classList.add('hidden');
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.className = 'flex-1 py-3 flex flex-col items-center text-gray-400 tab-btn hover:text-gray-600 transition-colors';
      });
      
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).className = 'flex-1 py-3 flex flex-col items-center text-emerald-600 font-medium tab-btn transition-colors';
    }
  </script>
</body>
</html>
